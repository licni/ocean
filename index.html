<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>海底世界漫遊</title>
<style>
:root{
  /* 佈局：全螢幕 3D 畫布，四個角落懸浮半透明儀表與按鈕，中央留給海 */
  --abyss:#03202f;
  --glass:rgba(3,28,44,.58);
  --line:rgba(160,228,226,.26);
  --foam:#e3f7f3;
  --mist:#9fc9cc;
  --sun:#ffd98a;
  --font-ui:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --font-display:"Songti TC","Noto Serif TC","Source Han Serif TC","PMingLiU",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--abyss);color:var(--foam);font-family:var(--font-ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
body.locked #gl{cursor:none}

#hud{position:fixed;left:max(14px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));display:flex;flex-wrap:wrap;max-width:50vw;gap:6px;pointer-events:none}
.ro{background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:6px 10px 7px;min-width:68px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ro span{display:block;font-size:11px;letter-spacing:.18em;color:var(--mist)}
.ro b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.ro i{font-style:normal;font-size:11px;color:var(--mist);margin-left:3px}

#bar{position:fixed;right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:46vw}
button{font:inherit;color:var(--foam);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;letter-spacing:.08em;cursor:pointer;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:manipulation}
button:hover{border-color:rgba(200,245,240,.55)}
button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
button[aria-pressed="true"]{background:rgba(255,217,138,.9);border-color:var(--sun);color:#06222f;font-weight:600}

#hint{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;
  background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:9px 16px;font-size:13px;color:var(--mist);max-width:calc(100vw - 32px);
  transition:opacity .8s;pointer-events:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#hint kbd{font:inherit;color:var(--foam);font-weight:600;margin-right:5px}
#hint.off{opacity:0}

#hud,#bar{transition:opacity .6s}
body:not(.started) #hud,body:not(.started) #bar{opacity:0;pointer-events:none}
#pad,#vbtn{display:none}
body.touch #hint{display:none}
body.touch.started #vbtn{display:flex}
#pad{position:fixed;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;border:1px solid var(--line);background:rgba(3,28,44,.35);pointer-events:none}
#pad.on{display:block}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(227,247,243,.55);border:1px solid rgba(255,255,255,.6)}
#padGhost{display:none;position:fixed;left:max(26px,env(safe-area-inset-left));bottom:max(30px,env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;
  border:1px dashed var(--line);color:var(--mist);font-size:12px;letter-spacing:.2em;align-items:center;justify-content:center;pointer-events:none}
body.touch.started #padGhost{display:flex}
body.touch.started #padGhost.hide{display:none}
#vbtn{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(30px,env(safe-area-inset-bottom));flex-direction:column;gap:10px}
#vbtn button{width:68px;height:56px;border-radius:16px;padding:0;font-size:14px}
#vbtn button.down{background:rgba(255,217,138,.9);color:#06222f}

#intro{position:fixed;inset:0;display:flex;align-items:safe center;justify-content:center;padding:20px;overflow:auto;
  background:radial-gradient(120% 90% at 50% 40%,rgba(2,22,36,.35),rgba(2,16,28,.82));transition:opacity .9s;cursor:pointer}
#intro.gone{opacity:0;pointer-events:none}
.card{max-width:560px;width:100%;text-align:left}
.card h1{font-family:var(--font-display);font-weight:600;font-size:clamp(34px,8vw,58px);letter-spacing:.14em;margin:0 0 10px;text-wrap:balance;text-shadow:0 2px 24px rgba(0,30,50,.8)}
.card p{margin:0 0 20px;color:var(--mist);font-size:15px;line-height:1.8;max-width:34em}
.keys{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;margin:0 0 24px;font-size:14px;line-height:1.5}
.keys dt{color:var(--sun);font-weight:600;letter-spacing:.06em;white-space:nowrap}
.keys dd{margin:0;color:var(--foam)}
.card{display:flex;flex-direction:column;align-items:flex-start}
#keysPc{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line);align-self:stretch}
@media (pointer:coarse){#keysPhone{order:-1;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line);align-self:stretch}#keysPc{border-bottom:0;padding-bottom:0;margin-bottom:22px;opacity:.75}.card h1{order:-3}.card p{order:-2}}
#go{font-size:16px;padding:12px 30px;background:rgba(255,217,138,.94);border-color:var(--sun);color:#06222f;font-weight:700;letter-spacing:.2em}
#go[disabled]{opacity:.55;cursor:default}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;line-height:1.8;color:var(--foam);background:var(--abyss)}
@media (max-width:520px){
  .ro{min-width:0;padding:5px 8px 6px}.ro b{font-size:16px}.ro span{font-size:10px;letter-spacing:.1em}
  button{padding:7px 11px;font-size:12px}
  #bar{max-width:46vw}
  #hud{flex-direction:column;gap:4px}
}
@media (max-height:460px) and (pointer:coarse){#keysPc{display:none}}
@media (max-height:460px){.card p{display:none}.card h1{font-size:30px;margin-bottom:8px}.keys{font-size:13px;gap:4px 14px;margin-bottom:12px}}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="海底世界 3D 畫面"></canvas>

<div id="hud">
  <div class="ro"><span>深度</span><b id="roDepth">0.0</b><i>m</i></div>
  <div class="ro"><span>焦距</span><b id="roFocal">18</b><i>mm</i></div>
  <div class="ro"><span>航向</span><b id="roHead">000</b><i>°</i></div>
  <div class="ro" id="roT" style="display:none"><span>時刻</span><b id="roTime">09:24</b></div>
  <div class="ro"><span>繪圖</span><b id="rend" style="font-size:13px;letter-spacing:.04em">…</b><i id="roFps"></i></div>
</div>

<div id="bar">
  <button id="bLamp" type="button" aria-pressed="false">探照燈</button>
  <button id="bTour" type="button" aria-pressed="false">自動巡航</button>
  <button id="bSnd" type="button" aria-pressed="false">聲音</button>
  <button id="bV" type="button" style="display:none">視點</button>
  <button id="bT" type="button" style="display:none">時間 自動</button>
  <button id="bQ" type="button">畫質 自動</button>
  <button id="bFull" type="button">全螢幕</button>
</div>

<div id="hint" class="off"></div>
<div id="padGhost">移動</div>
<div id="pad"><div id="knob"></div></div>
<div id="vbtn"><button id="bUp" type="button">上浮</button><button id="bDown" type="button">下潛</button></div>

<div id="intro">
  <div class="card">
    <h1>海底世界漫遊</h1>
    <p id="blurb">四十公尺高的海藻森林、珊瑚岩與石拱、深谷、沉船和石柱遺跡，都在這一個檔案裡。游過去看看，魚群會讓路。</p>
    <dl class="keys" id="keysPc">
      <dt>W A S D</dt><dd>前後左右移動（Shift 加速）</dd>
      <dt>滑鼠</dt><dd>轉動視角</dd>
      <dt>滾輪</dt><dd>切換焦距 12–135 mm</dd>
      <dt>Space ／ Q</dt><dd>上浮／下潛</dd>
      <dt>F ／ T ／ M</dt><dd>探照燈／自動巡航／聲音</dd>
      <dt class="gpuOnly" style="display:none">N</dt><dd class="gpuOnly" style="display:none">切換時間：自動日夜、正午、黃昏、夜晚、清晨</dd>
      <dt class="gpuOnly" style="display:none">1 – 6</dt><dd class="gpuOnly" style="display:none">跳到六個視點</dd>
    </dl>
    <dl class="keys" id="keysPhone">
      <dt>手機</dt><dd>左下角拖曳移動，其他地方拖曳轉動視角，雙指開合切換焦距</dd>
    </dl>
    <button id="go" type="button" disabled>載入中…</button>
  </div>
</div>
<div id="err"></div>

<script>
function startGL2(){
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('gl');
function fail(msg){const e=$('err');e.textContent=msg;e.style.display='flex';$('intro').style.display='none';}
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,depth:false,stencil:false,powerPreference:'high-performance'});
if(!gl){fail('這個瀏覽器不支援 WebGL2，無法顯示海底世界。請改用新版 Chrome、Edge、Firefox 或 Safari 開啟。');return;}

/* ───────── 畫質分級：所有裝置都從最高畫質開始，只有幀率明顯不足時才自動降一級，也可手動鎖定 ───────── */
const coarse=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
const HASH=(location.hash||'').toLowerCase();
const FLAGS=HASH.slice(1).split('-'),lite=FLAGS.includes('lite'),tmode=FLAGS.includes('t'),forceLDR=FLAGS.includes('ldr');
const devMem=navigator.deviceMemory||8;
const BF=lite?.16:tmode?.4:1;            // 建造時的葉片密度
const QT=[{name:'高',leaf:1,msaa:4,steps:20,bloom:true,px:2.3e6,sh:4096,far:1},
          {name:'中',leaf:.62,msaa:0,steps:12,bloom:true,px:1.5e6,sh:2048,far:.85},
          {name:'低',leaf:.36,msaa:0,steps:8,bloom:false,px:.85e6,sh:1024,far:.7}];
let qAuto=true,qLevel=lite?2:tmode?1:0;
/* ───────── 基本數學 ───────── */
const TAU=Math.PI*2;const T0=performance.now(),TM=[];const mark=n=>TM.push(n+':'+Math.round(performance.now()-T0));
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const mix=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l];};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const qAxis=(ax,an)=>{const s=Math.sin(an/2);return[ax[0]*s,ax[1]*s,ax[2]*s,Math.cos(an/2)];};
const qMul=(a,b)=>[a[3]*b[0]+a[0]*b[3]+a[1]*b[2]-a[2]*b[1],a[3]*b[1]-a[0]*b[2]+a[1]*b[3]+a[2]*b[0],a[3]*b[2]+a[0]*b[1]-a[1]*b[0]+a[2]*b[3],a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]];
const qYaw=a=>[0,Math.sin(a/2),0,Math.cos(a/2)];
function qUpTo(n,k){const ax=[n[2],0,-n[0]],l=Math.hypot(ax[0],ax[2]);if(l<1e-5)return[0,0,0,1];return qAxis([ax[0]/l,0,ax[2]/l],Math.acos(clamp(n[1],-1,1))*k);}
function hash3(x,y,z,s){let h=Math.imul(x,374761393)^Math.imul(y,668265263)^Math.imul(z,1440662683)^Math.imul(s,1274126177);h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296;}
function vnoise3(x,y,z,s){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);let fx=x-xi,fy=y-yi,fz=z-zi;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);fz=fz*fz*(3-2*fz);
  const h=(a,b,c)=>hash3(xi+a,yi+b,zi+c,s);
  return mix(mix(mix(h(0,0,0),h(1,0,0),fx),mix(h(0,1,0),h(1,1,0),fx),fy),mix(mix(h(0,0,1),h(1,0,1),fx),mix(h(0,1,1),h(1,1,1),fx),fy),fz);}
function tileNoise(period,seed){const r=mulberry(seed),g=new Float32Array(period*period);for(let i=0;i<g.length;i++)g[i]=r();
  return function(u,v){const x=u*period,y=v*period;let xi=Math.floor(x),yi=Math.floor(y);let fx=x-xi,fy=y-yi;xi=((xi%period)+period)%period;yi=((yi%period)+period)%period;
    const x1=(xi+1)%period,y1=(yi+1)%period;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);
    const a=g[yi*period+xi],b=g[yi*period+x1],c=g[y1*period+xi],d=g[y1*period+x1];return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy;};}

/* ───────── 世界設定：一塊 320 m 見方、可無限重複的海床，水面在 y=0 ───────── */
const P=320,GN=320,CELL=P/GN,CH=4,CHS=P/CH,CELLS_PER_CH=GN/CH;
const SUN=norm([0.36,0.88,0.26]);
const wrapD=d=>d-P*Math.round(d/P);
const wrapP=x=>((x%P)+P)%P;
const gauss=(x,z,cx,cz,r)=>{const dx=wrapD(x-cx),dz=wrapD(z-cz);return Math.exp(-(dx*dx+dz*dz)/(r*r));};
const distW=(x,z,cx,cz)=>Math.hypot(wrapD(x-cx),wrapD(z-cz));
const REEFS=[[90,100,46],[232,212,42],[252,58,28],[22,300,24]];
const BASINS=[[58,236,58,1],[188,28,38,1],[300,150,30,.9],[150,190,26,.8],[20,60,34,.9]];
const MESAS=[[162,240,20,19],[26,150,16,16],[280,126,17,21],[138,6,14,14]];
const RUIN=[128,58],WRECK=[204,112],JELLY=[58,168];
const SPAWN=[52,217];
const TOUR=[[118,74],[128,44],[100,92],[78,122],[62,168],[50,214],[70,250],[112,266],[134,212],[188,204],[226,214],[246,176],[236,138],[210,120],[236,86],[252,60],[214,40],[188,28],[158,46]];
const reefG=(x,z)=>{let m=0;for(const r of REEFS)m=Math.max(m,gauss(x,z,r[0],r[1],r[2]));return m;};
const zoneP=(x,z)=>Math.max(gauss(x,z,232,212,58),gauss(x,z,252,58,44),gauss(x,z,300,150,40),gauss(x,z,20,60,30)*.8);
const canyonZ=x=>160+34*Math.sin(TAU*x/P);
const canyon=(x,z)=>{const d=wrapD(z-canyonZ(x));return Math.exp(-(d*d)/169);};
const nA=tileNoise(3,11),nB=tileNoise(7,12),nC=tileNoise(17,13),nD=tileNoise(43,14),nE=tileNoise(53,15),nF=tileNoise(5,16),nG=tileNoise(6,17),nCl=tileNoise(37,18),nCl2=tileNoise(23,19),nK=tileNoise(9,20);
function mesaAt(x,z){let m=0;const u=x/P,v=z/P;for(const s of MESAS){const d=distW(x,z,s[0],s[1])+(nB(u+.3,v+.7)-.5)*s[2]*.55+(nC(u,v)-.5)*3;m=Math.max(m,s[3]*sstep(s[2],s[2]*.74,d));}return m;}
function heightRaw(x,z){const u=x/P,v=z/P;
  let h=-43+(nA(u,v)-.5)*9+(nB(u,v)-.5)*4.5+(nC(u,v)-.5)*1.8+(nD(u,v)-.5)*.5;
  const rg=reefG(x,z);h+=sstep(.12,.8,rg)*17+sstep(.2,.7,rg)*(nE(u,v)-.35)*1.8;
  h+=mesaAt(x,z)*(.9+.2*nC(u+.5,v+.5));
  h-=canyon(x,z)*(12+6*nF(u,v));
  h=mix(h,-27.5,sstep(27,13,distW(x,z,RUIN[0],RUIN[1])));
  return clamp(h,-61,-6);}
const HF=new Float32Array(GN*GN);
for(let j=0;j<GN;j++)for(let i=0;i<GN;i++)HF[j*GN+i]=heightRaw(i*CELL,j*CELL);
function heightAt(x,z){const fx=wrapP(x)/CELL,fz=wrapP(z)/CELL;const xi=Math.floor(fx)%GN,zi=Math.floor(fz)%GN,tx=fx-Math.floor(fx),tz=fz-Math.floor(fz),x1=(xi+1)%GN,z1=(zi+1)%GN;
  const a=HF[zi*GN+xi],b=HF[zi*GN+x1],c=HF[z1*GN+xi],d=HF[z1*GN+x1];return a+(b-a)*tx+(c-a)*tz+(a-b-c+d)*tx*tz;}
function normalAt(x,z){const e=1.2;return norm([heightAt(x-e,z)-heightAt(x+e,z),2*e,heightAt(x,z-e)-heightAt(x,z+e)]);}
const reefM=(x,z)=>sstep(.3,.72,reefG(x,z)+(nB(x/P,z/P)-.5)*.5);
const tourPts=[];for(let i=0;i<TOUR.length;i++){const a=TOUR[i],b=TOUR[(i+1)%TOUR.length],dx=wrapD(b[0]-a[0]),dz=wrapD(b[1]-a[1]),n=Math.ceil(Math.hypot(dx,dz)/3);for(let k=0;k<n;k++)tourPts.push([wrapP(a[0]+dx*k/n),wrapP(a[1]+dz*k/n)]);}
const nearTour=(x,z,r)=>{for(const p of tourPts)if(Math.abs(wrapD(x-p[0]))<r&&Math.abs(wrapD(z-p[1]))<r&&distW(x,z,p[0],p[1])<r)return true;return false;};
function kelpDens(x,z){if(distW(x,z,RUIN[0],RUIN[1])<16||distW(x,z,WRECK[0],WRECK[1])<12||distW(x,z,SPAWN[0],SPAWN[1])<4.5)return 0;
  let d=sstep(.56,.70,nK(x/P,z/P))*.45;for(const b of BASINS)d=Math.max(d,b[3]*sstep(b[2],b[2]*.7,distW(x,z,b[0],b[1])));
  return d*(1-.85*sstep(.25,.6,canyon(x,z)));}
/* ───────── WebGL 小工具 ───────── */
function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){throw new Error('shader: '+gl.getShaderInfoLog(s)+'\n'+src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n'));}return s;}
const TEXUNIT={uCaus:0,uNoise:1,uScene:2,uDepth:3,uRock:4,uShadow:5,uRays:6,uBloom:7,uSrc:8};
function program(vs,fs){const p=gl.createProgram();gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error('link: '+gl.getProgramInfoLog(p));
  const u={},n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);for(let i=0;i<n;i++){const nm=gl.getActiveUniform(p,i).name.replace(/\[0\]$/,'');u[nm]=gl.getUniformLocation(p,nm);}
  gl.useProgram(p);for(const k in TEXUNIT)if(u[k])gl.uniform1i(u[k],TEXUNIT[k]);
  return{p,u};}
/* ───────── 著色器 ───────── */
const HEAD='#version 300 es\nprecision highp float;\nprecision highp sampler3D;\nprecision highp sampler2DShadow;\n';
// 光學常數：SIG 沿視線的衰減、KD 向下的衰減、WCOL 海水散射色、SUNC 陽光
const CORE=`
const vec3 SIG=vec3(0.050,0.0205,0.0162);
const vec3 KD=vec3(0.046,0.0190,0.0128);
const vec3 WCOL=vec3(0.13,0.56,0.86);
const vec3 SUNC=vec3(1.75,1.62,1.42);
const float EXPO=1.18;
vec3 inscatter(vec3 rd,float d){
  vec3 a=max(SIG-KD*rd.y,vec3(0.0015));
  vec3 I=(1.0-exp(-a*d))/a;
  float mu=max(dot(rd,uSun),0.0);float m2=mu*mu;
  return WCOL*SIG*exp(KD*min(uCam.y,0.0))*I*(0.78+0.36*m2*m2);

vec3 sunE(float y){return SUNC*exp(KD*(min(y,0.0)/uSun.y));}
